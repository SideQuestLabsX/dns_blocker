name: Blocklist release

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blocklist-release
  cancel-in-progress: false

jobs:
  publish:
    name: Compile and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build compiler
        run: make tools PROFILE=minimal

      - name: Compile release blocklist
        run: sh tools/build-blocklist-release.sh

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="blocklist-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          title="Blocklist $(date -u +%Y-%m-%d)"
          notes=$(printf '%s\n\n%s %s\n' \
            "Compiled from blocklists/sources.txt at ${GITHUB_SHA}." \
            "Two upstream sources are GPL-3.0, so the trie is a combined work" \
            "under GPL-3.0. dns_blocker-blocklist.domains.txt.gz is its corresponding source. See THIRD_PARTY_LICENSES.md.")
          assets=(
            build/blocklist-release/dns_blocker-blocklist.trie
            build/blocklist-release/dns_blocker-blocklist.trie.sha256
            build/blocklist-release/dns_blocker-blocklist.sources
            build/blocklist-release/dns_blocker-blocklist.domains.txt.gz
            build/blocklist-release/THIRD_PARTY_LICENSES.md
          )

          gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" \
            --title "$title" --notes "$notes" --draft
          gh release edit "$tag" --draft=false --latest=false

          # The daemon downloads from this fixed tag, so its asset URLs never
          # change. Upload before edit, so a reader never sees the new notes
          # against the old assets
          stable="blocklist-latest"
          stableNotes=$(printf '%s\n\n%s\n' \
            "The current blocklist, republished every week. This tag is what the daemon downloads." \
            "Immutable dated copy of this build: ${tag}")
          if gh release view "$stable" >/dev/null 2>&1; then
            gh release upload "$stable" "${assets[@]}" --clobber
            gh release edit "$stable" --title "Blocklist (latest)" --notes "$stableNotes" --latest=false
          else
            gh release create "$stable" "${assets[@]}" --target "$GITHUB_SHA" \
              --title "Blocklist (latest)" --notes "$stableNotes" --latest=false
          fi
