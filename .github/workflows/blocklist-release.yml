name: Blocklist release

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blocklist-release
  cancel-in-progress: false

jobs:
  publish:
    name: Compile and publish
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build compiler
        run: make tools PROFILE=minimal

      - name: Compile every tier
        run: sh tools/build-blocklist-release.sh

      - name: Report what was built
        run: |
          cd build/blocklist-release
          ls -l dns_blocker-blocklist-*.trie
          cat dns_blocker-blocklist.sha256

      - name: Publish release assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/blocklist-release
          tag="blocklist-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          title="Blocklist $(date -u +%Y-%m-%d)"

          # One trie a tier, and one set of metadata however many tiers there are
          assets=(
            dns_blocker-blocklist.sha256
            dns_blocker-blocklist.sources
            dns_blocker-blocklist-sources.tar.gz
            THIRD_PARTY_LICENSES.md
          )
          while read -r tier; do
            assets+=("dns_blocker-blocklist-${tier}.trie")
          done < tiers

          notes=$(printf '%s\n\n%s\n%s\n\n%s %s\n' \
            "Compiled at ${GITHUB_SHA}. One trie a tier, $(wc -l < tiers) of them." \
            "dns_blocker-blocklist.sources names every source and the composition of every tier." \
            "dns_blocker-blocklist-sources.tar.gz holds the fetched lists themselves." \
            "Upstream sources are GPL-3.0, so every trie is a combined work under GPL-3.0." \
            "That manifest and that archive together are its corresponding source. See THIRD_PARTY_LICENSES.md.")

          gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" \
            --title "$title" --notes "$notes" --draft --latest=false
          gh release edit "$tag" --draft=false --latest=false

          publishedTag=$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            --jq 'select(.draft == false and .immutable == true) | .tag_name')
          if [ "$publishedTag" != "$tag" ]; then
            echo "::error::Published release is not immutable"
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Update release pointer
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          blob=$(printf '%s\n' "$RELEASE_TAG" | git hash-object -w --stdin)
          tree=$(printf '100644 blob %s\tlatest\n' "$blob" | git mktree)

          if git ls-remote --exit-code --heads origin \
            refs/heads/blocklist-pointer >/dev/null
          then
            git fetch --no-tags --depth=1 origin \
              refs/heads/blocklist-pointer
            commit=$(printf 'Point to %s\n' "$RELEASE_TAG" |
              git commit-tree "$tree" -p FETCH_HEAD)
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            commit=$(printf 'Point to %s\n' "$RELEASE_TAG" |
              git commit-tree "$tree")
          fi

          git push origin "${commit}:refs/heads/blocklist-pointer"
