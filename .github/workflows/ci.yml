name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so the guided fuzzer gets a long run against a growing corpus
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unit and integration tests under ASan and UBSan
        run: make test PROFILE=minimal

      - name: Build the daemon, the probe and the generator
        run: |
          make PROFILE=minimal
          make check PROFILE=minimal
          make tools PROFILE=minimal

      # The stub and the generated array define the same symbols, so a build
      # without an embedded list has to link as well
      - name: Build without an embedded list
        run: make PROFILE=minimal EMBED_LIST= BUILD=build/no-embed

      # The generator reloads its own output through the daemon's lookup, so
      # this also checks that the two agree on ordering.
      - name: Compile a list into a trie
        run: |
          cat > /tmp/ci.txt <<'LIST'
          # a comment, a hosts-file line and a wildcard rule
          doubleclick.net
          googlesyndication.com
          0.0.0.0 ads.example.com
          *.tracker.example.org
          LIST
          ./build/x86_64-minimal/mkblocklist /tmp/ci.trie /tmp/ci.txt

      - name: Whitespace
        run: git diff --check HEAD

      - name: Line endings
        run: |
          bad=$(git ls-files --eol | grep -E 'w/crlf|w/mixed' || true)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi

  encrypted:
    name: encrypted profile tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mbedTLS build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3

      - name: Build
        run: |
          make test PROFILE=encrypted
          make PROFILE=encrypted

      - name: Build immutable configuration
        run: >-
          make PROFILE=encrypted BUILD=build/immutable
          MBEDTLS_DIR=build/x86_64-encrypted/mbedtls
          FEATURES="-DCFG_BLOCKLIST_PATH=NULL -DCFG_STATUS_PATH=NULL"

      # The encrypted package carries the trust tool and the values it was
      # built with, which no other job assembles. Staged, so this also covers
      # --destdir. The package job installs for real
      - name: Package and stage an install
        run: |
          make PROFILE=encrypted check
          make PROFILE=encrypted package
          work=$(mktemp -d)
          tar -xzf build/package/dns_blocker-x86_64-encrypted.tar.gz -C "$work"
          (cd "$work/dns_blocker-x86_64-encrypted" && sh install.sh --destdir "$work/root")
          env="$work/root/usr/local/lib/dns_blocker/trust-bundle.env"
          grep -q '^CAP=[0-9]' "$env"
          grep -q 'cloudflare-dns.com' "$env"
          grep -q 'release-assets.githubusercontent.com' "$env"
          test -x "$work/root/usr/local/sbin/dns_blocker"
          test -x "$work/root/usr/local/sbin/dns_blocker.check"
          test -s "$work/root/etc/systemd/system/dns_blocker.service"
          test -s "$work/root/usr/local/lib/dns_blocker/THIRD_PARTY_LICENSES.md"
          test -s "$work/root/usr/local/lib/dns_blocker/LICENSE"

  package:
    name: package install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and package the minimal profile
        run: |
          make PROFILE=minimal
          make PROFILE=minimal check
          make PROFILE=minimal package

      # systemd as PID 1, because the unit is most of what the package installs
      # and a staged copy says nothing about whether it starts
      - name: Install and start in a clean container
        run: |
          docker run -d --name dnsb --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD/build/package:/pkg:ro" debian:12 \
            sh -c 'apt-get update -qq >/dev/null \
              && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq systemd systemd-sysv >/dev/null \
              && exec /sbin/init'

          state=
          for _ in $(seq 12); do
            sleep 5
            state=$(docker exec dnsb systemctl is-system-running 2>/dev/null || true)
            case "$state" in running|degraded) break ;; esac
          done
          test -n "$state" || { echo "systemd did not come up"; exit 1; }

          docker exec dnsb sh -c '
            set -e
            work=$(mktemp -d) && cd "$work"
            tar -xzf /pkg/dns_blocker-x86_64-minimal.tar.gz
            cd dns_blocker-x86_64-minimal
            sh install.sh
            systemctl daemon-reload
            systemctl enable --now dns_blocker
            sleep 2
            test "$(systemctl is-active dns_blocker)" = active
            dns_blocker.check
          '

      - name: Service log
        if: always()
        run: docker exec dnsb journalctl -u dns_blocker --no-pager || true

      - name: Remove the container
        if: always()
        run: docker rm -f dnsb || true

  live:
    name: live network checks
    # Real resolvers and the published release, so a failure can mean the
    # network rather than the tree. Weekly and on demand, never on a pull
    # request
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dig and the mbedTLS build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bind9-dnsutils python3

      - name: Blocklist sync against the published release
        run: make live-sync

      - name: DoH channel reuse against the configured resolvers
        run: make live-doh-reuse

      - name: Daemon output
        if: failure()
        run: tail -n 40 build/live/*/daemon.log || true

  fuzz:
    name: guided fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Restore corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .fuzz-corpus
            .fuzz-corpus-blocklist
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Build fuzzers
        run: make fuzz PROFILE=minimal

      # Each target gets the same budget, so one run covers the message parser
      # and the compiled list the daemon maps
      - name: Run
        run: |
          mkdir -p .fuzz-corpus .fuzz-corpus-blocklist
          seconds=120
          if [ "${{ github.event_name }}" = "schedule" ]; then seconds=900; fi
          ./build/x86_64-minimal/fuzz_wire .fuzz-corpus \
            -max_total_time=$seconds -print_final_stats=1
          ./build/x86_64-minimal/fuzz_blocklist .fuzz-corpus-blocklist \
            -max_total_time=$seconds -print_final_stats=1

      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: |
            crash-*
            leak-*
            timeout-*
          if-no-files-found: ignore

  target:
    name: ${{ matrix.arch }} target
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            image: alpine:3.20
          - arch: x86
            platform: linux/386
            image: i386/alpine:3.20
          - arch: aarch64
            platform: linux/arm64
            image: arm64v8/alpine:3.20
          - arch: armv7
            platform: linux/arm/v7
            image: arm32v7/alpine:3.20
          - arch: armv6
            platform: linux/arm/v6
            image: arm32v6/alpine:3.20
          - arch: riscv64
            platform: linux/riscv64
            image: riscv64/alpine:3.20
          - arch: loongarch64
            zig_target: loongarch64-linux-musl
            runner: qemu-loongarch64
          - arch: mips
            zig_target: mips-linux-musleabi
            runner: qemu-mips
          - arch: mipsel
            zig_target: mipsel-linux-musleabi
            runner: qemu-mipsel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: ${{ matrix.image != '' }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      # ARM1176 faults on unaligned reads that x86 cannot expose
      - name: Build and test in Alpine
        if: ${{ matrix.image != '' }}
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cat > /tmp/build.sh <<'SH'
          set -e
          apk add --no-cache build-base curl python3
          make ARCH="$ARCH" PROFILE=minimal
          make ARCH="$ARCH" PROFILE=minimal check
          make ARCH="$ARCH" PROFILE=minimal test-static-run
          make ARCH="$ARCH" PROFILE=encrypted
          make ARCH="$ARCH" PROFILE=encrypted test-static-run
          SH
          docker run --rm --platform "${{ matrix.platform }}" \
            -e ARCH -v "$PWD:/w" -v /tmp/build.sh:/build.sh -w /w \
            "${{ matrix.image }}" sh /build.sh

      - name: Install Zig and QEMU
        if: ${{ matrix.zig_target != '' }}
        env:
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          ZIG_VERSION: 0.16.0
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl -fsSL --retry 3 \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            -o "$archive"
          printf '%s  %s\n' "$ZIG_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$archive" --strip-components=1 -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Cross-build and test with Zig
        if: ${{ matrix.zig_target != '' }}
        env:
          ARCH: ${{ matrix.arch }}
          RUNNER: ${{ matrix.runner }}
          ZIG_TARGET: ${{ matrix.zig_target }}
        run: |
          export CC="zig cc -target $ZIG_TARGET"
          export AR="zig ar"
          export EMBED_LIST=
          export EMBED_TIER=
          make ARCH="$ARCH" PROFILE=minimal
          make ARCH="$ARCH" PROFILE=minimal check
          make ARCH="$ARCH" PROFILE=minimal RUNNER="$RUNNER" test-static-run
          make ARCH="$ARCH" PROFILE=encrypted
          make ARCH="$ARCH" PROFILE=encrypted RUNNER="$RUNNER" test-static-run

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dns_blocker-${{ matrix.arch }}
          path: |
            build/${{ matrix.arch }}-minimal/dns_blocker
            build/${{ matrix.arch }}-minimal/THIRD_PARTY_LICENSES.md
            build/${{ matrix.arch }}-encrypted/dns_blocker
            build/${{ matrix.arch }}-encrypted/THIRD_PARTY_LICENSES.md
